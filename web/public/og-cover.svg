<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">电子礼簿：清楚记下每一份心意</title>
  <desc id="desc">朱砂印章、纸色背景与礼簿插图组成的电子礼簿社交预览图</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbf6ec"/><stop offset=".55" stop-color="#f7efe1"/><stop offset="1" stop-color="#f1e4cc"/>
    </linearGradient>
    <linearGradient id="seal" x1="84" y1="76" x2="190" y2="184" gradientUnits="userSpaceOnUse">
