    <linearGradient id="book" x1="830" y1="150" x2="1050" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a52a21"/><stop offset="1" stop-color="#721712"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#392013" flood-opacity=".18"/>
    </filter>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse">
