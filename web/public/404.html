<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>页面没有找到 · 电子礼簿</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root { color-scheme: light; font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif; color: #281c13; background: #faf4e9; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 12% 8%, #f0dfbd 0, transparent 34rem), radial-gradient(circle at 88% 82%, #efd6cd 0, transparent 30rem), #faf4e9; }
      main { width: min(760px, 100%); padding: clamp(28px, 7vw, 64px); border: 1px solid #e3d2b5; border-radius: 20px; background: rgb(255 250 241 / .94); box-shadow: 0 28px 80px rgb(55 33 17 / .12); }
      .brand { display: inline-flex; align-items: center; min-height: 44px; gap: 11px; color: #6f261f; font-family: "KaiTi", "STKaiti", serif; font-size: 20px; font-weight: 650; letter-spacing: .08em; text-decoration: none; }
      .seal { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 5px; color: #fff8e9; background: linear-gradient(145deg, #bd3429, #8f1d18); font-size: 24px; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .25); }
      .code { margin: 42px 0 0; color: #ab2b21; font-family: Georgia, serif; font-size: clamp(72px, 18vw, 132px); font-weight: 600; line-height: .9; letter-spacing: -.04em; }
      h1 { margin: 20px 0 10px; font-family: "Songti SC", "SimSun", serif; font-size: clamp(26px, 5vw, 38px); letter-spacing: .06em; }
      .lead { max-width: 36em; margin: 0; color: #615340; font-size: 15px; line-height: 1.8; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
      .actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 20px; border: 1px solid #d8c5a5; border-radius: 8px; color: #5b4b39; background: #fffdf8; font-weight: 600; text-decoration: none; }
      .actions a:first-child { border-color: #ab2b21; color: #fffaf2; background: #ab2b21; }
      .actions a:hover, .actions a:focus-visible { border-color: #8f241c; color: #8f241c; background: #f8e9e3; }
      .actions a:first-child:hover, .actions a:first-child:focus-visible { color: #fffaf2; background: #8f241c; }
      .hint { margin: 24px 0 0; padding-top: 18px; border-top: 1px solid #e5d8c2; color: #74624d; font-size: 12px; line-height: 1.7; }
      @media (max-width: 480px) { body { padding: 12px; } main { padding: 26px 20px; border-radius: 14px; } .actions { display: grid; grid-template-columns: 1fr; } .actions a { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/"><span class="seal">礼</span><span>电子礼簿</span></a>
      <div class="code" aria-hidden="true">404</div>
      <h1>这一页没有找到</h1>
      <p class="lead">地址可能写错了，或页面已经被移动。礼簿数据没有受到影响，你可以直接回到常用入口。</p>
      <nav class="actions" aria-label="常用入口">
        <a href="/">返回首页</a>
        <a href="/?action=create">免费创建礼簿</a>
        <a href="/?action=help">查看使用说明</a>
        <a href="/?action=settings">打开站点设置</a>
      </nav>
      <p class="hint">如果你是从书签或他人分享的链接进入，请让分享者重新发送正确地址。</p>
    </main>
  </body>
</html>
