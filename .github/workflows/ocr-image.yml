name: Release image

# 用户部署只有 ghcr.io/1316195118/gift-book:latest 一个入口。
# latest 是 amd64 + arm64 多架构镜像，并统一包含 OCR。
# update-vX.Y.Z-<arch> 仅供程序内部自更新，不作为部署标签。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/1316195118/gift-book

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: Build and publish multi-arch latest
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.ocr \
            --build-arg BUILD_ID="$GITHUB_RUN_ID" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            -t "$IMAGE:latest" --push .
          # GHCR 在接收 manifest 后偶尔有几秒读取延迟，校验需要短重试。
          for i in $(seq 1 10); do
            if docker buildx imagetools inspect "$IMAGE:latest"; then
              exit 0
            fi
            sleep 3
          done
          echo "latest manifest is still unavailable after retries" >&2
          exit 1

  # 容器内自更新的二进制包：把裸二进制推成 OCI artifact，标签 update-vX.Y.Z-<arch>。
  # 不依赖外部工具，用仓库内的 cmd/oci-push（纯标准库）上传。
  update-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve release version
        id: release
        run: |
          VERSION="$(node -p "require('./web/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match project version v$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build
      - name: Prepare embed dist
        run: |
          mkdir -p webapp/dist
          cp -r web/dist/. webapp/dist/
          printf '{"build":"%s","version":"%s"}\n' "$GITHUB_RUN_ID" "${{ steps.release.outputs.version }}" > webapp/dist/build.json
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o /tmp/giftbook-${{ matrix.arch }} ./cmd/giftbook
      - name: Push OCI update package
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          go run ./cmd/oci-push \
            -file "/tmp/giftbook-${{ matrix.arch }}" \
            -tag "update-v${{ steps.release.outputs.version }}-${{ matrix.arch }}" \
            -repo "1316195118/gift-book"
