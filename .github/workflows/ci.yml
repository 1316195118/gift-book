name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      # 先构建前端产物（embed 需要 webapp/dist 存在），再跑后端检查。
      - name: Build frontend + binary
        run: node scripts/build.mjs

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Frontend unit tests
        working-directory: web
        run: npx vitest run

      # 有 error 即失败；存量 warning 不阻塞，后续再逐条清理。
      - name: Frontend lint
        working-directory: web
        run: npx eslint src

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build frontend + binary
        run: node scripts/build.mjs

      - name: Install headless Chromium
        working-directory: web
        run: npx playwright-core install chromium

      - name: Start app
        run: |
          mkdir -p /tmp/gb-e2e/data /tmp/gb-e2e/config
          ./giftbook -addr 127.0.0.1 -port 18199 -data /tmp/gb-e2e/data -config /tmp/gb-e2e/config > /tmp/gb-e2e/server.log 2>&1 &

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18199/api/build; then exit 0; fi
            sleep 1
          done
          cat /tmp/gb-e2e/server.log
          exit 1

      - name: Run E2E smoke
        working-directory: web
        env:
          BASE_URL: http://127.0.0.1:18199
        run: npm run e2e:smoke
