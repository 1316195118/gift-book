name: gift-book

services:
  gift-book:
    image: ghcr.io/1316195118/gift-book:ocr-v2.4.43  # 多架构 OCR 镜像（amd64 / arm64）
    container_name: gift-book                       # 容器名
    user: "1000:10"                                 # 权限：容器以 UID:GID 运行（绿联 UGOS Pro 首用户为 1000:10）
    ports:
      - "8099:8099"                                 # 宿主机:容器 端口映射
    environment:
      - TZ=Asia/Shanghai                            # 时区
      - GIFTBOOK_AUTO_RESTART=true                  # 自更新完成后优雅退出，由重启策略拉起新版本
      - GIFTBOOK_UPDATE_PROXY=http://10.10.10.254:7890  # NAS 无法直连 GitHub 时通过内网代理访问 GHCR
      # - GIFTBOOK_SETUP_TOKEN=change-me            # 首次开启访问保护时要求的口令
      # - GIFTBOOK_TRUST_PROXY=1                    # 位于受信任反向代理后开启
    restart: unless-stopped                         # 容器策略：开机自启 + 异常重启
    volumes:
      - /volume1/docker/gift-book/data:/data        # 账簿数据持久化
      - /volume1/docker/gift-book/config:/config    # 认证、备份与自更新二进制持久化
    deploy:
      resources:
        limits:
          cpus: "2"                                 # CPU 核数上限
          memory: 512M                              # 内存上限
    # 健康检查：镜像已内置 busybox wget，可直接使用
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8099/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
