# 直接拉公共镜像部署（不需要源码，NAS 面板里贴这段即可）
services:
  gift-book:
    image: ghcr.io/1316195118/gift-book:latest
    container_name: gift-book
    network_mode: "bridge"
    ports:
      - "${PORT:-8099}:80"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - LANG=C.UTF-8
    volumes:
      - ./data:/var/www/html/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
